product:
  summary: >-
    Blog técnico pessoal do felvieira com posts autorais sobre IA, engenharia de
    software e ferramentas de dev, gerados com apoio de um agente Claude Code.
  problemSolved: >-
    Remove a fricção de manter um blog técnico: sem esse workflow, publicar exigiria
    escrever HTML/CSS à mão, gerar/editar imagens, atualizar índice da home e do
    README manualmente, e lembrar de divulgar no LinkedIn a cada post — trabalho
    repetitivo que desestimula publicar com frequência. O autor manda só um assunto
    ou texto e o resto do pipeline (escrita, imagem, HTML, índice, divulgação) roda
    sozinho, o que viabiliza publicar seguido sem esse custo de manutenção.
  valueProposition: >-
    Publicação assistida por IA: o autor manda um assunto ou texto, o sistema escreve
    o post, gera imagens e publica automaticamente, sem esforço manual de HTML/CSS.
  features:
    - Geração de post autoral em pt-BR (ou en) a partir de assunto/texto/URL, via skill externa dev-team-kit-fv:41-blog-publisher
    - Scaffold de post a partir de TEMPLATE.html (scripts/new-post.mjs) preenchendo title, excerpt, data (ISO + humana), tempo de leitura estimado (palavras / 220 wpm) e lang label
    - Geração automática de imagem de capa + imagens inline (via fal.ai gemini-25-flash ou Playwright screenshot, executado fora deste repo)
    - Cover image embutida no corpo do post (tag <img>) além do og:image, com fallback para OpenGraph do GitHub quando não há blog-config configurado
    - Bloco de compartilhamento pronto para LinkedIn (hook curto + texto completo pré-formatado + botão "copiar texto" via assets/js/share.js + link direto para abrir o LinkedIn)
    - Notificação automática opcional por webhook pessoal (n8n) ao publicar, enviando o texto pronto do LinkedIn — só dispara se LINKEDIN_WEBHOOK_URL estiver setada
    - Índice da home (hero + 2 secundários + lista com thumbnail, scripts/update-index.mjs) e do README regenerados automaticamente a cada novo post, por marcadores de comentário
    - Suporte bilíngue pt-BR/en por post, com bandeira/label de idioma exibida no post e na listagem
    - Data exibida em formato DD/MM/AAAA nos cards da home
    - Configuração multi-usuário via ~/.dev-team-kit/blog-config.json (github_user, blog_repo, pages_url), com fallback local-only quando ausente
    - Deploy automático via GitHub Pages (push para main = site atualizado), sem CI custom
    - "Licenciamento explícito: texto sob CC-BY-4.0, código dos snippets sob Apache-2.0"
